name: Recall
options:
  bundleIdPrefix: com.ashar
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Recall:
    type: application
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/App
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Recall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashar.Recall
        PRODUCT_NAME: Recall
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # Not sandboxed on purpose: Recall reads local history stores directly, and a
        # sandbox would turn every source directory into a folder prompt.
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets:
        - RecallTests

  RecallCLI:
    type: tool
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/CLI
    settings:
      base:
        PRODUCT_NAME: recall
        PRODUCT_BUNDLE_IDENTIFIER: com.ashar.recall.cli
        CODE_SIGN_STYLE: Automatic
    scheme: {}

  RecallTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Recall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashar.RecallTests
        GENERATE_INFOPLIST_FILE: YES
